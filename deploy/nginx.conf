# nginx server block for the Rick and Morty list.
#
# nginx does not read .htaccess — those files have no effect here, so this has
# to be applied in the server config by hand.
#
#   cp deploy/nginx.conf /etc/nginx/sites-available/rickandmorty
#   ln -s /etc/nginx/sites-available/rickandmorty /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;

    # The document root is public/. src/, tests/, test.php and this file all sit
    # above it, so no rule is needed to protect them — they are simply not
    # inside the tree nginx can serve.
    root /var/www/html/RinckAndMortyPage/public;
    index index.php;

    autoindex off;   # off by default; stated so a future edit doesn't flip it

    add_header X-Content-Type-Options  "nosniff"                       always;
    add_header X-Frame-Options         "SAMEORIGIN"                    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Dotted path segments: .git, .env, editor leftovers. This must stay above
    # the `\.php$` block — nginx evaluates regex locations in file order and
    # stops at the first match, so a PHP handler placed first would execute
    # them instead of refusing them.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # match your PHP version
    }
}
