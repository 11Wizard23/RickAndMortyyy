# Apache virtual host for the Rick and Morty list.
#
# The point of this file is DocumentRoot: it must be public/, not the project
# root. With it pointed correctly, src/ and the test suite are outside the
# served tree and no rule can accidentally expose them.
#
#   cp deploy/apache.conf /etc/apache2/sites-available/rickandmorty.conf
#   a2ensite rickandmorty && a2enmod headers rewrite
#   apachectl configtest && systemctl reload apache2

<VirtualHost *:80>
    ServerName rickandmorty.local

    DocumentRoot /var/www/html/RinckAndMortyPage/public

    <Directory /var/www/html/RinckAndMortyPage/public>
        Options -Indexes -MultiViews +FollowSymLinks

        # public/.htaccess carries the hygiene rules. Set to None here and fold
        # those rules into this block if you prefer to avoid per-request
        # .htaccess lookups.
        AllowOverride All

        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/rickandmorty-error.log
    CustomLog ${APACHE_LOG_DIR}/rickandmorty-access.log combined
</VirtualHost>
